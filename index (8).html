<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ديرما إيسينس</title>
<meta name="description" content="ديرما إيسينس – عناية بالبشرة مصنَّعة في ألمانيا.">
<link rel="canonical" href="">
<meta property="og:type" content="website">
<meta property="og:title" content="ديرما إيسينس">
<meta property="og:description" content="عناية بالبشرة مصنَّعة في ألمانيا.">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#17457C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ==========================================================================
   Derma Essence — design system v2
   Grounded in the packaging: hairline rules, a tinted square behind the
   wordmark, wide-tracked uppercase range names, and one accent per range.
   Every token is overwritten at runtime from the Settings sheet; the shades
   between them are derived from the primary so the sheet stays small.
   ========================================================================== */
:root{
  --primary:#17457C; --navy:#102F55; --clinical:#3E7CA8;
  --p-50:#F1F5FA; --p-100:#DFE8F2; --p-200:#BCCEE2; --p-700:#123963;
  --secondary:#16202B; --accent:#E8722A;
  --bg:#F6F9FC; --surface:#FFFFFF; --heading:#16202B;
  --body:#3A4753; --muted:#667789; --line:#E3E8EE;
  --font-head:'Archivo',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:10px; --r-sm:6px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(16,47,85,.05), 0 4px 14px rgba(16,47,85,.05);
  --shadow-2:0 10px 34px rgba(16,47,85,.10);
  --step:clamp(52px,6.5vw,96px);
  --shell:1240px; --gutter:clamp(16px,4vw,48px);
  --hd:66px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --tap:44px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font-body);
  font-size:16px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--heading);font-weight:600;
  line-height:1.18;margin:0;letter-spacing:-.015em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] h4{letter-spacing:0;line-height:1.35}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.shell{max-width:var(--shell);margin-inline:auto;padding-inline:var(--gutter)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;inset-inline-start:14px;top:-70px;z-index:300;background:var(--primary);
  color:#fff;padding:12px 20px;border-radius:var(--r-sm);transition:top .2s}
.skip:focus{top:14px}
.rail{display:flex;height:3px;width:100%}
.rail span{flex:1}

/* ------------------------------------------------------------ announcement */
.ann{background:var(--navy);color:#fff;font-size:12.5px;letter-spacing:.06em;
  font-family:var(--font-mono)}
.ann .shell{display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:36px;text-align:center;position:relative;padding-block:6px}
.ann-x{color:#fff;opacity:.65;font-size:20px;line-height:1;position:absolute;
  inset-inline-end:calc(var(--gutter) - 10px);width:var(--tap);height:var(--tap);
  display:grid;place-items:center}
.ann-x:hover{opacity:1}

/* ----------------------------------------------------------------- header */
header.hd{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
header.hd.on{border-bottom-color:var(--line);box-shadow:0 1px 20px rgba(16,47,85,.06)}
.hd-in{display:flex;align-items:center;gap:14px;height:var(--hd)}
.brand{display:flex;align-items:center;flex-shrink:0;min-height:var(--tap)}
.brand img{max-height:38px;width:auto}
.mark{position:relative;display:inline-flex;flex-direction:column;align-items:center;
  padding:6px 12px;border:1px solid var(--secondary);border-radius:2px}
.mark::before{content:"";position:absolute;inset-inline-end:-5px;top:-5px;width:22px;height:22px;
  background:var(--primary);opacity:.15;border-radius:1px}
.mark b{font-family:var(--font-head);font-weight:600;font-size:14px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--secondary);line-height:1;position:relative}
.mark i{font-family:var(--font-head);font-style:normal;font-size:8px;letter-spacing:.38em;
  text-transform:uppercase;color:var(--muted);margin-top:3px;position:relative}
nav.main{display:flex;gap:2px;margin-inline-start:auto;align-items:center}
.nitem{position:relative}
.nlink{display:inline-flex;align-items:center;gap:6px;height:var(--tap);padding:0 14px;
  font-size:15px;color:var(--body);border-radius:var(--r-sm);transition:color .18s,background .18s}
.nlink:hover{color:var(--primary);background:var(--p-50)}
.nlink[aria-current=page]{color:var(--primary);font-weight:500}
.caret{width:9px;height:9px;border-inline-end:1.6px solid currentColor;
  border-block-end:1.6px solid currentColor;transform:rotate(45deg);margin-top:-3px;opacity:.6}
.mega{position:absolute;top:calc(100% + 8px);inset-inline-start:50%;transform:translateX(50%) translateY(-8px);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;
  width:min(640px,86vw);display:grid;grid-template-columns:1fr 1fr;gap:4px;
  opacity:0;visibility:hidden;transition:.2s var(--ease);box-shadow:var(--shadow-2)}
[dir=ltr] .mega{transform:translateX(-50%) translateY(-8px)}
.nitem:hover .mega,.nitem:focus-within .mega{opacity:1;visibility:visible;transform:translateX(50%) translateY(0)}
[dir=ltr] .nitem:hover .mega,[dir=ltr] .nitem:focus-within .mega{transform:translateX(-50%) translateY(0)}
.mega a{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-sm);
  min-height:var(--tap)}
.mega a:hover{background:var(--p-50)}
.mega .bar{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.mega strong{display:block;font-size:14.5px;color:var(--heading);font-weight:500}
.mega span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.tools{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ibtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--body);
  border-radius:var(--r-sm)}
.ibtn:hover{background:var(--p-50);color:var(--primary)}
.lang{height:var(--tap);padding:0 14px;font-family:var(--font-mono);font-size:12.5px;
  letter-spacing:.08em;border:1px solid var(--line);border-radius:var(--r-pill);
  text-transform:uppercase;color:var(--body)}
.lang:hover{border-color:var(--primary);color:var(--primary)}
.burger{display:none}

/* ------------------------------------------------------------------ buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);
  padding:12px 24px;font-size:15px;font-weight:500;border-radius:var(--r-pill);
  border:1.5px solid transparent;transition:.2s var(--ease);text-align:center}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--p-700)}
.btn-o{border-color:var(--line);color:var(--heading);background:var(--surface)}
.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-w{background:#fff;color:var(--navy)}
.btn-w:hover{background:var(--p-50)}
.btn-g{border-color:rgba(255,255,255,.5);color:#fff}
.btn-g:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn-sm{padding:9px 16px;font-size:14px;min-height:38px}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}

/* -------------------------------------------------------------------- hero */
.hero{position:relative;background:var(--p-50);overflow:hidden;isolation:isolate}
.hero-motif{position:absolute;inset:0;pointer-events:none;z-index:0}
.slide{display:none}
.slide.on{display:block}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;
  gap:clamp(24px,4vw,56px);align-items:center;
  padding-block:clamp(36px,5vw,76px);min-height:clamp(440px,58vh,600px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-mono);
  font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--primary);
  margin-bottom:16px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--accent);border-radius:2px}
.hero h1{font-size:clamp(30px,4.4vw,52px);margin-bottom:16px;color:var(--navy)}
.hero-lead{font-size:clamp(15.5px,1.5vw,18px);color:var(--body);max-width:48ch}
.hero-cta{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;padding-top:24px;
  border-top:1px solid var(--p-200)}
.trust li{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--navy);
  background:rgba(255,255,255,.75);border:1px solid var(--p-200);border-radius:var(--r-pill);
  padding:7px 14px}
.trust svg{flex-shrink:0;color:var(--primary)}
.hero-figure{position:relative;display:grid;place-items:center;min-height:300px}
.hero-plate{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0%,var(--p-100) 62%,var(--p-200) 100%);
  z-index:0}
.hero-figure img,.hero-figure .ps{position:relative;z-index:1;width:min(300px,72%);
  height:auto;aspect-ratio:4/5;object-fit:contain;
  filter:drop-shadow(0 24px 40px rgba(16,47,85,.18))}
.dots{display:flex;gap:6px;position:relative;z-index:2;padding-bottom:22px}
.dots button{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:50%}
.dots button i{display:block;width:26px;height:4px;border-radius:2px;background:var(--p-200);
  transition:background .2s}
.dots button[aria-current=true] i{background:var(--primary);width:34px}

/* ---------------------------------------------------------------- sections */
.sec{padding-block:var(--step)}
.sec-alt{background:var(--surface)}
.sec-head{max-width:640px;margin-bottom:clamp(26px,3.4vw,46px)}
.sec-head.mid{margin-inline:auto;text-align:center}
.sec-head h2{font-size:clamp(23px,3vw,34px);margin-bottom:12px;color:var(--navy)}
.sec-head p{color:var(--muted);font-size:16px}
.grid{display:grid;gap:clamp(12px,1.5vw,20px)}
.c2{grid-template-columns:repeat(2,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}

/* concern finder */
.concerns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.concern{display:inline-flex;align-items:center;gap:10px;min-height:var(--tap);
  padding:10px 20px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-pill);font-size:15px;color:var(--heading);
  transition:.2s var(--ease);box-shadow:var(--shadow-1)}
.concern:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.concern .n{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);
  background:var(--p-50);border-radius:var(--r-pill);padding:2px 8px}
.concern:hover .n{background:var(--p-100);color:var(--primary)}

/* product card */
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:100%;
  transition:border-color .22s,box-shadow .22s,transform .22s var(--ease)}
.card:hover{border-color:var(--p-200);box-shadow:var(--shadow-2);transform:translateY(-3px)}
.card-fig{position:relative;aspect-ratio:1/1;background:linear-gradient(170deg,#fff,var(--p-50));
  display:grid;place-items:center;padding:14px}
.card-fig img,.card-fig .ps{width:100%;height:100%;object-fit:contain}
.card-fig img{opacity:0;transition:opacity .35s}
.card-fig img.ready{opacity:1}
.imgskel{position:absolute;inset:14px;border-radius:var(--r-sm);
  background:linear-gradient(90deg,#EEF2F6 25%,#F7FAFC 37%,#EEF2F6 63%);
  background-size:400% 100%;animation:sh 1.4s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.badge{position:absolute;top:12px;inset-inline-start:12px;z-index:2;font-family:var(--font-mono);
  font-size:10.5px;letter-spacing:.1em;padding:5px 10px;border-radius:var(--r-pill);
  background:var(--c);color:#fff}
.card-b{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1;gap:6px}
.k-series{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--c)}
.card-b h3{font-size:16.5px;line-height:1.4;min-height:2.8em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-type{font-size:13.5px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:11.5px;color:var(--navy);background:var(--p-50);border-radius:var(--r-pill);
  padding:4px 10px;white-space:nowrap}
.card-foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
.size{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.card-cta{font-size:13.5px;font-weight:500;color:var(--primary);display:inline-flex;
  align-items:center;gap:6px;min-height:34px}
.card:hover .card-cta{gap:9px}
.stretch::after{content:"";position:absolute;inset:0;z-index:3}

/* routine */
.routine{counter-reset:s;display:grid;gap:14px}
.step{position:relative;display:flex;gap:18px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;transition:.2s var(--ease)}
.step:hover{border-color:var(--c);box-shadow:var(--shadow-1)}
.step-n{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;flex-shrink:0;
  display:grid;place-items:center;font-family:var(--font-mono);font-size:13px}
.step-fig{width:64px;height:64px;flex-shrink:0;background:var(--p-50);border-radius:var(--r-sm);
  display:grid;place-items:center;padding:6px}
.step-fig img,.step-fig .ps{width:100%;height:100%;object-fit:contain}
.step h3{font-size:15.5px;margin-bottom:3px}
.step p{font-size:13.5px;color:var(--muted)}

/* ingredients */
.ing{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  height:100%;display:flex;flex-direction:column;gap:7px}
.ing .inci{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);
  word-break:break-word}
.ing h3{font-size:16px}
.ing p{font-size:13.5px;color:var(--muted);flex:1}
.ing .cnt{font-family:var(--font-mono);font-size:11px;color:var(--primary)}

/* why / story */
.why{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,4vw,60px);align-items:center}
.why-body p{margin-bottom:14px}
.pillars{display:grid;gap:12px}
.pillar{display:flex;gap:14px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.pillar .dot{width:34px;height:34px;border-radius:50%;background:var(--p-50);color:var(--primary);
  display:grid;place-items:center;flex-shrink:0}
.pillar h3{font-size:15.5px;margin-bottom:4px}
.pillar p{font-size:13.5px;color:var(--muted)}

/* manufacturing */
.mfg{background:var(--navy);color:#DCE5EF}
.mfg h2,.mfg h3{color:#fff}
.mfg p{color:#AFBDCC}
.marks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:32px}
.mark-c{border:1px solid rgba(255,255,255,.16);border-radius:var(--r);padding:20px}
.mark-c b{display:block;font-family:var(--font-mono);font-size:16px;letter-spacing:.08em;color:#fff}
.mark-c span{font-size:13px;color:#9FAEBF}
.mfg-note{margin-top:26px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;
  color:#8496A9}

/* cta */
.cta{background:linear-gradient(140deg,var(--primary),var(--navy));color:#fff;text-align:center}
.cta h2{color:#fff;font-size:clamp(22px,2.8vw,32px);margin-bottom:12px}
.cta p{color:rgba(255,255,255,.86);max-width:54ch;margin-inline:auto}
.cta-b{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* --------------------------------------------------------------- listing */
.lay{display:grid;grid-template-columns:262px 1fr;gap:clamp(20px,2.6vw,40px);align-items:start}
.bar{position:sticky;top:calc(var(--hd) + 8px);z-index:20;background:var(--bg);
  padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-bottom:14px}
.sbox{display:flex;align-items:center;gap:9px;flex:1;min-width:190px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:0 16px;min-height:var(--tap)}
.sbox input{border:0;background:none;outline:none;width:100%;font-size:14.5px}
.sbox svg{color:var(--muted);flex-shrink:0}
select.sort{min-height:var(--tap);border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-pill);padding:0 16px;font-size:14px}
.count{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.active-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.achip{display:inline-flex;align-items:center;gap:7px;background:var(--p-50);color:var(--navy);
  border:1px solid var(--p-100);border-radius:var(--r-pill);padding:6px 8px 6px 14px;font-size:13px}
[dir=rtl] .achip{padding:6px 14px 6px 8px}
.achip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);font-size:15px;line-height:1}
.achip button:hover{background:var(--p-100);color:var(--navy)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.fg{padding-block:16px;border-bottom:1px solid var(--line)}
.fg:first-child{padding-top:0}
.fg:last-of-type{border-bottom:0;padding-bottom:8px}
.fg h3{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);
  padding:8px 14px;font-size:13.5px;min-height:36px;transition:.16s;color:var(--body)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.chip[aria-pressed=true]::before{content:"✓ ";font-size:11px}
.fopen{display:none}
.fclose,.fapply{display:none}

/* states */
.skel-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  overflow:hidden}
.skel-card .f{aspect-ratio:1/1;background:linear-gradient(90deg,#EEF2F6 25%,#F7FAFC 37%,#EEF2F6 63%);
  background-size:400% 100%;animation:sh 1.4s ease-in-out infinite}
.skel-line{height:11px;margin:14px 18px;border-radius:3px;
  background:linear-gradient(90deg,#EEF2F6 25%,#F7FAFC 37%,#EEF2F6 63%);
  background-size:400% 100%;animation:sh 1.4s ease-in-out infinite}
.state{text-align:center;padding:clamp(40px,6vw,72px) 22px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r)}
.state svg{color:var(--p-200);margin-bottom:14px}
.state h3{font-size:19px;margin-bottom:8px}
.state p{color:var(--muted);max-width:46ch;margin-inline:auto;margin-bottom:20px}

/* ------------------------------------------------------------- detail panel */
.pd{position:fixed;inset:0;z-index:160;display:none}
.pd.on{display:block}
.veil{position:absolute;inset:0;background:rgba(16,47,85,.45);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{position:absolute;inset-block:0;inset-inline-end:0;width:min(760px,100%);
  background:var(--surface);overflow-y:auto;overscroll-behavior:contain;
  animation:slide .3s var(--ease);display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}
[dir=ltr] .panel{animation-name:slideL}
@keyframes slideL{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.p-top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.crumbs a:hover{color:var(--primary);text-decoration:underline}
.p-hero{background:linear-gradient(170deg,#fff,var(--p-50));display:grid;place-items:center;
  padding:26px;border-bottom:1px solid var(--line)}
.p-hero img,.p-hero .ps{width:min(280px,64%);aspect-ratio:4/5;object-fit:contain}
.p-body{padding:26px 22px 60px;flex:1}
.p-series{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--c);margin-bottom:8px}
.p-body h2{font-size:clamp(21px,2.6vw,28px);margin-bottom:10px}
.p-lead{font-size:16px;margin-bottom:20px}
.bens{display:grid;gap:9px;margin-bottom:22px}
.ben{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.ben svg{flex-shrink:0;color:var(--c);margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;
  margin-bottom:24px}
.fact{background:var(--p-50);border-radius:var(--r-sm);padding:12px 14px}
.fact dt{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.fact dd{margin:0;font-size:14px;color:var(--navy);font-weight:500}
.acc{border-top:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:16px 2px;min-height:var(--tap);font-size:15px;font-weight:500;color:var(--heading)}
.acc summary::-webkit-details-marker{display:none}
.acc summary .pm{width:22px;height:22px;position:relative;flex-shrink:0}
.acc summary .pm::before,.acc summary .pm::after{content:"";position:absolute;background:var(--muted);
  inset-inline-start:3px;top:10px;width:16px;height:1.8px;transition:transform .22s}
.acc summary .pm::after{transform:rotate(90deg)}
.acc[open] summary .pm::after{transform:rotate(0)}
.acc .in{padding:0 2px 20px;font-size:14.5px}
.acc ul{margin:0;padding-inline-start:18px}
.acc li{margin-bottom:6px}
.ingrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;
  border-bottom:1px solid var(--line)}
.ingrow:last-child{border-bottom:0}
.ingrow .inci{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.warn{background:#FFF6EE;border:1px solid #F6DCC6;border-inline-start:3px solid var(--accent);
  border-radius:var(--r-sm);padding:14px 16px;font-size:14px;color:#7A4415;display:flex;gap:10px}
.warn svg{flex-shrink:0;color:var(--accent);margin-top:2px}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.relc{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;
  gap:10px;align-items:center;min-height:var(--tap)}
.relc:hover{border-color:var(--primary)}
.relc .th{width:44px;height:44px;background:var(--p-50);border-radius:var(--r-sm);flex-shrink:0;
  display:grid;place-items:center;padding:3px}
.relc .th img,.relc .th .ps{width:100%;height:100%;object-fit:contain}
.relc span{font-size:13px;line-height:1.4}
.p-actions{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;z-index:5}
.p-actions .btn{flex:1}

/* ---------------------------------------------------------------- search */
.sw{position:fixed;inset:0;z-index:180;display:none;align-items:flex-start;justify-content:center;
  padding:clamp(60px,10vh,120px) 16px 16px;background:rgba(16,47,85,.42)}
.sw.on{display:flex}
.sbx{background:var(--surface);width:min(680px,100%);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow-2)}
.sbx-top{display:flex;align-items:center;gap:12px;padding:6px 10px 6px 18px;
  border-bottom:1px solid var(--line)}
[dir=rtl] .sbx-top{padding:6px 18px 6px 10px}
.sbx-top input{flex:1;border:0;outline:none;background:none;padding:16px 0;font-size:17px}
.sres{max-height:min(56vh,440px);overflow-y:auto}
.sres a{display:flex;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);
  min-height:var(--tap)}
.sres a:last-child{border-bottom:0}
.sres a:hover,.sres a.sel{background:var(--p-50)}
.sres .th{width:52px;height:52px;background:var(--p-50);border-radius:var(--r-sm);flex-shrink:0;
  display:grid;place-items:center;padding:4px}
.sres .th img,.sres .th .ps{width:100%;height:100%;object-fit:contain}
.sres strong{display:block;font-size:14.5px;color:var(--heading);font-weight:500}
.sres small{display:block;font-size:12.5px;color:var(--muted)}
.shint{padding:22px 18px;color:var(--muted);font-size:14px;text-align:center}
.skbd{padding:9px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);
  font-family:var(--font-mono);display:flex;gap:14px;flex-wrap:wrap}

/* ---------------------------------------------------------------- drawer */
.dw{position:fixed;inset:0;z-index:170;background:var(--surface);transform:translateX(100%);
  transition:transform .28s var(--ease);display:flex;flex-direction:column;overflow-y:auto}
[dir=ltr] .dw{transform:translateX(-100%)}
.dw.on{transform:translateX(0)}
.dw-top{display:flex;align-items:center;justify-content:space-between;padding:12px var(--gutter);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dw nav{padding:8px var(--gutter) 40px}
.dw nav a{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--line);
  font-size:16.5px}
.dw nav a.sub{padding-inline-start:16px;font-size:15px;color:var(--muted);min-height:46px}
.dw nav a.sub .bar{width:3px;height:18px;border-radius:2px;margin-inline-end:10px}

/* ----------------------------------------------------------------- footer */
footer{background:var(--secondary);color:#AEBAC6;margin-top:auto}
.f-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:34px;
  padding-block:clamp(40px,5vw,64px)}
footer h3{color:#fff;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;margin-bottom:14px}
footer a{display:flex;align-items:center;min-height:36px;font-size:14.5px;color:#AEBAC6}
footer a:hover{color:#fff}
.f-brand .mark{border-color:rgba(255,255,255,.45)}
.f-brand .mark b{color:#fff}
.f-brand p{font-size:14px;margin-top:14px;max-width:32ch}
.socials{display:flex;gap:8px;margin-top:16px}
.socials a{width:var(--tap);height:var(--tap);border:1px solid rgba(255,255,255,.2);
  border-radius:50%;justify-content:center}
.socials a:hover{border-color:#fff}
.f-bot{border-top:1px solid rgba(255,255,255,.12);padding-block:18px;display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.f-bot nav{display:flex;gap:18px;flex-wrap:wrap}
.f-bot a{min-height:auto}

.notice{background:#FFF7E6;color:#7A5B10;font-size:13.5px;text-align:center;padding:9px 16px}
.toast{position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translateX(50%) translateY(150%);
  background:var(--navy);color:#fff;padding:13px 22px;border-radius:var(--r-pill);font-size:14px;
  z-index:220;transition:transform .3s var(--ease)}
[dir=ltr] .toast{transform:translateX(-50%) translateY(150%)}
.toast.on{transform:translateX(50%) translateY(0)}
[dir=ltr] .toast.on{transform:translateX(-50%) translateY(0)}

/* ------------------------------------------------------------- responsive */
@media(max-width:1024px){
  .c4{grid-template-columns:repeat(3,1fr)}
  .why{grid-template-columns:1fr}
  .lay{grid-template-columns:1fr}
  .side{position:fixed;inset:0;z-index:190;border-radius:0;border:0;overflow-y:auto;
    transform:translateY(100%);transition:transform .3s var(--ease);
    padding:0 var(--gutter) 96px;display:flex;flex-direction:column}
  .side.on{transform:translateY(0)}
  .fclose{display:flex;position:sticky;top:0;background:var(--surface);z-index:2;
    align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);
    margin-bottom:8px}
  .fclose h2{font-size:18px}
  .fapply{display:flex;position:fixed;inset-inline:0;bottom:0;padding:12px var(--gutter);
    background:var(--surface);border-top:1px solid var(--line);gap:10px;z-index:3}
  .fapply .btn{flex:1}
  .fopen{display:inline-flex}
}
@media(max-width:860px){
  nav.main{display:none}
  .burger{display:grid}
  .c3,.c4{grid-template-columns:repeat(2,1fr)}
  .hero-grid{grid-template-columns:1fr;min-height:0;padding-block:28px 20px;gap:22px;
    text-align:center}
  .eyebrow{justify-content:center}
  .hero h1{font-size:clamp(26px,7vw,34px)}
  .hero-lead{margin-inline:auto;font-size:15.5px}
  .hero-cta{justify-content:center}
  .hero-cta .btn{flex:1;min-width:150px}
  .trust{justify-content:center;margin-top:22px;padding-top:18px}
  .hero-figure{order:-1;min-height:0}
  .hero-figure img,.hero-figure .ps{width:min(210px,58%)}
  .hero-plate{width:62%}
  .dots{justify-content:center;padding-bottom:14px}
  .panel{width:100%}
  .p-hero img,.p-hero .ps{width:min(220px,58%)}
}
@media(max-width:600px){
  :root{--hd:58px}
  .c2,.c3,.c4{grid-template-columns:repeat(2,1fr)}
  .card-b{padding:12px 12px 14px}
  .card-b h3{font-size:14.5px;min-height:2.6em}
  .card-type,.tag{font-size:12px}
  .card-cta span{display:none}
  .f-grid{grid-template-columns:1fr 1fr;gap:24px}
  .f-brand{grid-column:1/-1}
  .step{padding:14px;gap:12px}
  .step-fig{width:52px;height:52px}
  .facts{grid-template-columns:1fr 1fr}
  .marks{grid-template-columns:1fr}
}
@media(max-width:380px){
  .c2,.c3,.c4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){

.rv.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}

scription_ar":"كريم مرطّب مركّز طُوِّر في ألمانيا للبشرة شديدة الجفاف. يجمع بين اليوريا والجلسرين كعوامل ترطيب، والسكوالان وزبدة الشيا كعوامل تنعيم، إلى جانب الفوسفوليبيدات والسفينجوليبيدات. يُستخدم صباحًا ومساءً أو عند الحاجة، ويُدلَّك بحركات دائرية حتى الامتصاص الكامل.","full_description_en":"An intensive moisturizer developed in Germany for extremely dry skin. It pairs urea and glycerin as humectants with squalane and shea butter as emollients, alongside phospholipids and sphingolipids. Use morning and evening or as needed, massaging in circular motions until fully absorbed.","main_ingredients_ar":"يوريا، جلسرين، سكوالان، زبدة الشيا، ألفا-جلوكان أوليجوساكاريد، دايميثيكون، بارافين سائل، فوسفوليبيدات، سفينجوليبيدات، مستخلص خلايا الهليكريسوم، لاكتوباسيلوس، مستخلص الأنداريا، عصير جذور البوليمنيا، توكوفيرول","main_ingredients_en":"Urea, Glycerin, Squalane, Butyrospermum Parkii Butter, Alpha-Glucan Oligosaccharide, Dimethicone, Paraffinum Liquidum, Phospholipids, Sphingolipids, Helichrysum Stoechas Callus Culture Lysate, Lactobacillus, Undaria Pinnatifida Extract, Polymnia Sonchifolia Root Juice, Tocopherol","ingredient_concentrations":"Glycerin 8.4% | Urea 5% | Paraffinum Liquidum 4% | Dimethicone 2% | Squalane 2% | Alpha-Glucan Oligosaccharide 1.4% | Butyrospermum Parkii Butter 1% | Polymnia Sonchifolia Root Juice 0.38% | Phospholipids 0.09% | Helichrysum Stoechas 0.03% | Lactobacillus 0.02% | Sphingolipids 0.01% | Undaria Pinnatifida 0.002% | Tocopherol 0.002% — (النسب من بيان التركيبة المرفق من Crevil وليست مطبوعة على العبوة)","uses_ar":"ترطيب عميق وطويل الأمد للبشرة شديدة الجفاف – تغذية عميقة للبشرة واستعادة نعومتها الطبيعية وإشراقها – الحفاظ على نعومة البشرة لفترة أطول","uses_en":"Deep hydration cream specially formulated for extremely dry skin; deeply nourishes the skin, restoring its natural softness and radiance; keeps skin soft for longer","how_to_use_ar":"توضع كمية مناسبة من المرطِّب على البشرة – يُدلَّك الكريم بلطف بحركات دائرية حتى الامتصاص الكامل – يُستخدم صباحًا ومساءً أو عند الحاجة – لأفضل النتائج يُستخدم يوميًا وبانتظام","how_to_use_en":"Apply an appropriate amount of moisturizer to the skin. Massage the cream gently in circular motions until fully absorbed. Use the moisturizer morning and evening or as needed. For best results, use daily and consistently.","skin_type_ids":"ST-01,ST-02","concern_ids":"CON-04","usage_area_ids":"UA-01,UA-03","texture_id":"TEX-01","size_value":"150","size_unit_ar":"مل","size_unit_en":"ml","warnings_ar":"للاستعمال الخارجي فقط – يُتجنَّب ملامسة العينين – يُحفظ بعيدًا عن متناول الأطفال","warnings_en":"For external use only. Avoid contact with eyes. Keep out of reach of children.","usage_frequency_ar":"مرتان يوميًا أو عند الحاجة – يُنصح بالاستخدام اليومي المنتظم","usage_frequency_en":"Twice daily, or as needed","usage_time_ar":"صباحًا ومساءً","usage_time_en":"Morning and evening","benefits_ar":"تركيبة ألمانية متقدمة – ترطيب عميق طويل الأمد – ملمس حريري ناعم – Made in Germany – تصنيع Crevil Cosmetics & Pharmaceuticals Germany GmbH – نصوص بثلاث لغات (عربي/إنجليزي/ألماني)","benefits_en":"Advanced German formula · Deep long-lasting hydration · Silky-smooth skin · Made in Germany · Manufactured by Crevil Cosmetics & Pharmaceuticals Germany GmbH","key_claim_1_ar":"ترطيب عميق طويل الأمد","key_claim_1_en":"Deep, long-lasting hydration","key_claim_2_ar":"تركيبة ألمانية متقدمة تعيد للبشرة نعومتها","key_claim_2_en":"An advanced German formula that restores softness","key_claim_3_ar":"ملمس حريري ناعم","key_claim_3_en":"A silky-smooth finish","barcode":"6286709001287","country_of_origin_ar":"ألمانيا","country_of_origin_en":"Germany","manufacturer_id":"MFR-01","main_image_url":"https://hxsshwsyzjvrhwkklfsu.supabase.co/storage/v1/object/public/DERMA%20ESCENCE/DE-HYD-IMC-150ML.webp","secondary_image_url":"","packaging_image_url":"https://hxsshwsyzjvrhwkklfsu.supabase.co/storage/v1/object/public/DERMA%20ESCENCE/DE-HYD-IMC-150ML.webp","lifestyle_image_url":"","image_alt_ar":"عبوة هيدرا كريم مرطّب مركّز", e pack matches what is inside it.","hero_image_url":"","seo_title_ar":"عن ديرما إيسينس | ديرما إيسينس","seo_title_en":"About Derma Essence | Derma Essence","seo_description_ar":"علامة عناية بالبشرة تُصنَّع في ألمانيا","seo_description_en":"A skincare brand manufactured in Germany","sort_order":2,"is_active":"TRUE"},{"page_id":"PG-03","page_type":"philosophy","slug":"our-philosophy","title_ar":"فلسفتنا","title_en":"Our Philosophy","subtitle_ar":"ثلاثة مبادئ نلتزم بها","subtitle_en":"Three principles we hold to","content_ar":"**التركيبة أولًا.** كل منتج يبدأ من بيان تركيبة موثَّق يحدد نسبة كل مادة ووظيفتها، لا من ادعاء تسويقي.\n\n**نوع بشرة واحد في كل مرة.** لا نصمّم منتجًا واحدًا «يناسب الجميع»؛ الغسول الحسّاس يختلف عن الغسول الدهني في التركيبة لا في العبوة فقط.\n\n**ما نقوله هو ما نستطيع إثباته.** لا ادعاءات علاجية غير موثَّقة، ولا وعود لا تدعمها التركيبة.","content_en":"**Formula first.** Every product begins with a documented formula statement specifying each ingredient's concentration and function — not with a marketing claim.\n\n**One skin type at a time.** We do not design a single product that \"suits everyone\"; the sensitive cleanser differs from the oily cleanser in its formula, not just its box.\n\n**We say only what we can support.** No undocumented therapeutic claims, and no promises the formula does not back.","hero_image_url":"","seo_title_ar":"فلسفتنا | ديرما إيسينس","seo_title_en":"Our Philosophy | Derma Essence","seo_description_ar":"ثلاثة مبادئ نلتزم بها","seo_description_en":"Three principles we hold to","sort_order":3,"is_active":"TRUE"},{"page_id":"PG-04","page_type":"products","slug":"products","title_ar":"المنتجات","title_en":"Products","subtitle_ar":"عشرة منتجات في خمس مجموعات","subtitle_en":"Ten products across five categories","content_ar":"","content_en":"","hero_image_url":"","seo_title_ar":"المنتجات | ديرما إيسينس","seo_title_en":"Products | Derma Essence","seo_description_ar":"عشرة منتجات في خمس مجموعات","seo_description_en":"Ten products across five categories","sort_order":4,"is_active":"TRUE"},{"page_id":"PG-05","page_type":"ingredients","slug":"ingredients","title_ar":"المواد الفعّالة","title_en":"Ingredients","subtitle_ar":"ما هو مذكور في بيانات التركيبة","subtitle_en":"What the formula statements record","content_ar":"كل مادة مذكورة هنا مأخوذة من بيان التركيبة الرسمي الصادر عن جهة التصنيع، والوظيفة المكتوبة بجانبها هي الوظيفة المسجَّلة في ذلك البيان — لا وصف تسويقي أضفناه.","content_en":"Every ingredient listed here is taken from the official formula statement issued by the manufacturer, and the function shown beside it is the function recorded in that statement — not marketing copy we added.","hero_image_url":"","seo_title_ar":"المواد الفعّالة | ديرما إيسينس","seo_title_en":"Ingredients | Derma Essence","seo_description_ar":"ما هو مذكور في بيانات التركيبة","seo_description_en":"What the formula statements record","sort_order":5,"is_active":"TRUE"},{"page_id":"PG-06","page_type":"concerns","slug":"skin-concerns","title_ar":"مشاكل البشرة","title_en":"Skin Concerns","subtitle_ar":"ابدئي من المشكلة، لا من المنتج","subtitle_en":"Start from the concern, not the product","content_ar":"","content_en":"","hero_image_url":"","seo_title_ar":"مشاكل البشرة | ديرما إيسينس","seo_title_en":"Skin Concerns | Derma Essence","seo_description_ar":"ابدئي من المشكلة، لا من المنتج","seo_description_en":"Start from the concern, not the product","sort_order":6,"is_active":"TRUE"},{"page_id":"PG-07","page_type":"manufacturing","slug":"manufacturing-quality","title_ar":"جودة التصنيع","title_en":"Manufacturing Quality","subtitle_ar":"مصنَّع في ميونخ، ألمانيا","subtitle_en":"Manufactured in Munich, Germany","content_ar":"تُصنَّع منتجات ديرما إيسينس لدى Crevil Cosmetics & Pharmaceuticals Germany GmbH في ميونخ بألمانيا.\n\nتلتزم جهة التصنيع بمتطلبات الجمعية الألمانية لمستحضرات التجميل والعطور والمنظفات (IKW)، وبمعايير ممارسات التصنيع الجيد (GMP)، وبتوجيه مستحضرات التجميل الأوروبي 76/768/EEC.\n\nيصدر لكل منتج بيان تركيبة رسمي (Formula Ingredients Statement) يحدد اسم كل مادة بنظام INCI ونسبتها المئوية ورقم CAS ووظيفتها.","content_en":"Derma Essence products are manufactured by Crevil Cosmetics & Pharmaceuticals Germany GmbH in Munich, Germany.\n\nThe manufacturer works to the requirements of the German Cosmetic, Toiletry, Perfumery and Detergent Association (IKW), to Good Manufacturing Practice (GMP) standards, and to the European Cosmetics Directive 76/768/EEC.\n\nEach product is issued a formal Formula Ingredients Statement listing every ingredient's INCI name, percentage, CAS number and function.","hero_image_url":"","seo_title_ar":"جودة التصنيع | ديرما إيسينس","seo_title_en":"Manufacturing Quality | Derma Essence","seo_description_ar":"مصنَّع في ميونخ، ألمانيا","seo_description_en":"Manufactured in Munich, Germany","sort_order":7,"is_active":"TRUE"},{"page_id":"PG-08","page_type":"contact","slug":"contact-us","title_ar":"تواصلي معنا","title_en":"Contact Us","subtitle_ar":"نسعد بالإجابة على استفساراتك","subtitle_en":"We're glad to answer your questions","content_ar":"","content_en":"","hero_image_url":"","seo_title_ar":"تواصلي معنا | ديرما إيسينس","seo_title_en":"Contact Us | Derma Essence","seo_description_ar":"نسعد بالإجابة على استفساراتك","seo_description_en":"We're glad to answer your questions","sort_order":8,"is_active":"TRUE"},{"page_id":"PG-09","page_type":"legal","slug":"privacy-policy","title_ar":"سياسة الخصوصية","title_en":"Privacy Policy","subtitle_ar":"","subtitle_en":"","content_ar":"هذه الصفحة بحاجة إلى صياغة نهائية من الجهة القانونية قبل النشر. لا تنشر الموقع قبل تعبئة هذا المحتوى.","content_en":"This page requires final wording from your legal advisor before publication. Do not publish the site before this content is completed.","hero_image_url":"","seo_title_ar":"سياسة الخصوصية | ديرما إيسينس","seo_title_en":"Privacy Policy | Derma Essence","seo_description_ar":"","seo_description_en":"","sort_order":9,"is_active":"FALSE"},{"page_id":"PG-10","page_type":"legal","s _url":"","button_text_ar":"","button_text_en":"","button_link":"","layout":"third","background_color":"","sort_order":2,"is_active":"TRUE"},{"block_id":"BLK-06","page_id":"PG-07","block_type":"feature","title_ar":"76/768/EEC","title_en":"76/768/EEC","content_ar":"توجيه مستحضرات التجميل الأوروبي","content_en":"European Cosmetics Directive","image_url":"","button_text_ar":"","button_text_en":"","button_link":"","layout":"third","background_color":"","sort_order":3,"is_active":"TRUE"}],"FAQs":[{"faq_id":"FAQ-01","category":"General","question_ar":"أين تُصنَّع منتجات ديرما إيسينس؟","question_en":"Where are Derma Essence products manufactured?","answer_ar":"تُصنَّع في ميونخ بألمانيا لدى Crevil Cosmetics & Pharmaceuticals Germany GmbH، وتحمل كل عبوة عبارة Made in Germany واسم جهة التصنيع.","answer_en":"In Munich, Germany, by Crevil Cosmetics & Pharmaceuticals Germany GmbH. Every pack carries the Made in Germany mark and the manufacturer's name.","sort_order":1,"is_active":"TRUE"},{"faq_id":"FAQ-02","category":"Products","question_ar":"كيف أختار الغسول المناسب لبشرتي؟","question_en":"How do I choose the right cleanser?","answer_ar":"هناك ثلاثة غسولات: هيدرا للبشرة العادية إلى الجافة، هيدرا للبشرة الحسّاسة بتركيبة بدون كبريتات قاسية، وسيبيوم للبشرة الدهنية والمعرَّضة لحب الشباب. استخدمي فلتر «نوع البشرة» في صفحة المنتجات.","answer_en":"There are three: Hydra for normal to dry skin, Hydra Sensitive with a sulfate-free surfactant system, and Sebium for oily, acne-prone skin. Use the skin type filter on the products page.","sort_order":2,"is_active":"TRUE"},{"faq_id":"FAQ-03","category":"Sun Care","question_ar":"ما الفرق بين واقيات الشمس الثلاثة؟","question_en":"What is the difference between the three sunscreens?","answer_ar":"جميعها SPF 50+ وواسعة الطيف. كريم البشرة الجافة يعتمد على فلاتر معدنية (أكسيد الزنك)، وكريم الجل للبشرة الدهنية يعتمد على فلاتر عضوية بقوام خفيف، والبخاخ مخصَّص للوجه والجسم ولكل أفراد العائلة.","answer_en":"All three are SPF 50+ broad spectrum. The dry skin cream uses mineral filters (zinc oxide), the oily skin cremogel uses organic filters in a light texture, and the spray is for face and body and the whole family.","sort_order":3,"is_active":"TRUE"},{"faq_id":"FAQ-04","category":"Sun Care","question_ar":"كم مرة يجب إعادة وضع الواقي الشمسي؟","question_en":"How often should sunscreen be reapplied?","answer_ar":"حسب المكتوب على العبوة: يوضع قبل التعرض للشمس بـ 15–20 دقيقة، ويُعاد التطبيق كل ساعتين أو بعد السباحة أو التعرق.","answer_en":"As printed on the pack: apply 15–20 minutes before sun exposure and reapply every two hours, or after swimming or sweating.","sort_order":4,"is_active":"TRUE"},{"faq_id":"FAQ-05","category":"Ingredients","question_ar":"هل تعرضون نسب المكونات؟","question_en":"Do you publish ingredient concentrations?","answer_ar":"نعرض المواد الفعّالة الرئيسية لكل منتج. أما النسب المئوية فمصدرها بيان التركيبة الصادر عن جهة التصنيع، ولا تُعرض للعامة إلا بعد اعتمادها من الجهة التنظيمية.","answer_en":"We show each product's key actives. The percentages come from the manufacturer's formula statement and are only published after regulatory approval.","sort_order":5,"is_active":"TRUE"},{"faq_id":"FAQ-06","category":"Products","question_ar":"هل يمكن استخدام جل حب الشباب على الوجه كاملًا؟","question_en":"Can the acne gel be used on the whole face?","answer_ar":"طريقة الاستخدام على العبوة تحدد وضع كمية صغيرة مباشرة على الحبوب أو المناطق المصابة، مع تجنّب البشرة الملتهبة أو الجروح المفتوحة.","answer_en":"The pack directs applying a small amount directly onto pimples or affected areas, avoiding inflamed skin or open wounds.","sort_order":6,"is_active":"TRUE"},{"faq_id":"FAQ-07","category":"General","question_ar":"هل المنتجات مناسبة للأطفال؟","question_en":"Are the products suitable for children?","answer_ar":"بخاخ الحماية من الشمس مكتوب عليه أنه لكل أفراد العائلة، ولا تحدد العبوة فئة عمرية. بقية المنتجات لا تذكر فئة عمرية، ويُنصح باستشارة الطبيب للأطفال.","answer_en":"The sun protection spray states it is for all family members, without specifying an age range. The other products do not state an age range; consult a doctor for children.","sort_order":7,"is_active":"TRUE"},{"faq_id":"FAQ-08","category":"General","question_ar":"هل المنتجات متوفرة للشراء عبر الموقع؟","question_en":"Can I buy the products through this site?","answer_ar":"هذا الموقع للعرض والتعريف بالمنتجات فقط ولا يتم البيع من خلاله حاليًا.","answer_en":"This site presents and explains the products only; it does not currently sell them.","sort_order":8,"is_active":"TRUE"}],"Contact_Info":[{"contact_id":"CI-01","contact_type":"whatsapp","label_ar":"واتساب","label_en":"WhatsApp","value":"","link":"","icon":"whatsapp","sort_order":1,"is_active":"FALSE"},{"contact_id":"CI-02","contact_type":"phone","label_ar":"الهاتف","label_en":"Phone","value":"","link":"","icon":"phone","sort_order":2,"is_active":"FALSE"},{"contact_id":"CI-03","contact_type":"email","label_ar":"البريد الإلكتروني","label_en":"Email","value":"","link":"","icon":"mail","sort_order":3,"is_active":"FALSE"},{"contact_id":"CI-04","contact_type":"address","label_ar":"العنوان","label_en":"Address","value":"","link":"","icon":"pin","sort_order":4,"is_active":"FALSE"},{"contact_id":"CI-05","contact_type":"manufacturer_site","label_ar":"موقع جهة التصنيع","label_en":"Manufacturer website","value":"www.crevil.de","link":"https://www.crevil.de","icon":"globe","sort_order":5,"is_active":"TRUE"}],"Manufacturers":[{"manufacturer_id":"MFR-01","manufacturer_name_ar":"كريفيل لمستحضرات التجميل والأدوية ألمانيا","manufacturer_name_en":"Crevil Cosmetics & Pharmaceuticals Germany GmbH","country_ar":"ألمانيا","country_en":"Germany","city_ar":"ميونخ","city_en":"Munich","public_description_ar":"جهة التصنيع الألمانية لمنتجات ديرما إيسينس، ومقرها ميونخ. تلتزم بمتطلبات الجمعية الألمانية IKW وبمعايير ممارسات التصنيع الجيد GMP وبتوجيه مستحضرات التجميل الأوروبي 76/768/EEC، وتصدر لكل منتج بيان تركيبة رسميًا يحدد المكونات والنسب والوظائف.","public_description_en":"The German man /* ---------------------------------------------------------------- safety */
function esc(v){
  if(v===null||v===undefined) return "";
  return String(v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
}
function rich(v){
  return esc(v).split(/\n\s*\n/).filter(function(x){return x.trim()}).map(function(p){
    return "<p>"+p.replace(/\n/g,"<br>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</p>";
  }).join("");
}
function safeUrl(u){
  u=String(u||"").trim();
  return /^(https?:\/\/|\/|\.\/|images\/|#)/i.test(u)?u:"";
}
function bool(v){
  if(v===true) return true;
  if(typeof v==="string") return v.trim().toUpperCase()==="TRUE";
  return v===1;
}
function ids(v){return String(v||"").split(",").map(function(s){return s.trim()}).filter(Boolean)}
function L(row,base){
  if(!row) return "";

  if(v===undefined||v==="") v=row[base];
  if(v===undefined||v==="") v=row[base+"_"+(S.lang==="ar"?"en":"ar")];

}

  var a=rows(sheet);

}
function setting(key,fb){
  var a=(S.data&&S.data.Settings)||[];
  for(var i=0;i<a.length;i++) if(a[i].setting_key===key){
    var v=a[i]["setting_value_"+S.lang];
    if(v===undefined||v==="") v=a[i].setting_value_ar;
    if(v===undefined||v==="") v=a[i].setting_value_en;
    return (v===undefined||v==="")?(fb===undefined?"":fb):v;
  }
  return fb===undefined?"":fb;
}

/* -------------------------------------------------------------- colour ops */
function hex2rgb(h){
  h=String(h||"").replace("#","");
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n=parseInt(h,16);
  return isNaN(n)?[23,69,124]:[(n>>16)&255,(n>>8)&255,n&255];
}
function mix(hex,target,amt){
  var a=hex2rgb(hex),b=hex2rgb(target);
  var r=a.map(function(v,i){return Math.round(v+(b[i]-v)*amt)});
  return "#"+r.map(function(v){return ("0"+v.toString(16)).slice(-2)}).join("");
}

function applyTheme(){
  var st=document.documentElement.style;
  var map={"--primary":"primary_color","--secondary":"secondary_color","--accent":"accent_color",
    "--bg":"background_color","--surface":"surface_color","--heading":"heading_color",
    "--body":"body_text_color","--muted":"muted_text_color","--line":"border_color"};
  Object.keys(map).forEach(function(k){var v=setting(map[k],"");if(v) st.setProperty(k,v)});

  var p=setting("primary_color","#17457C");
  st.setProperty("--navy",mix(p,"#000000",.34));
  st.setProperty("--clinical",mix(p,"#FFFFFF",.34));
  st.setProperty("--p-700",mix(p,"#000000",.16));
  st.setProperty("--p-200",mix(p,"#FFFFFF",.70));
  st.setProperty("--p-100",mix(p,"#FFFFFF",.86));
  st.setProperty("--p-50",mix(p,"#FFFFFF",.94));
  var tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.setAttribute("content",p);

  var head=setting(S.lang==="ar"?"heading_font_ar":"heading_font_en","");
  var body=setting(S.lang==="ar"?"body_font_ar":"body_font_en","");
  var mono=setting("mono_font","");
  if(head) st.setProperty("--font-head","'"+head+"',system-ui,sans-serif");
  if(body) st.setProperty("--font-body","'"+body+"',system-ui,sans-serif");
  if(mono) st.setProperty("--font-mono","'"+mono+"',ui-monospace,monospace");

  /* only the weights actually used, only for the active language */
  var fams=[];
  if(head) fams.push("family="+encodeURIComponent(head)+":wght@500;600");
  if(body&&body!==head) fams.push("family="+encodeURIComponent(body)+":wght@400;500");
  if(mono) fams.push("family="+encodeURIComponent(mono)+":wght@400");
  var old=document.getElementById("de-fonts"); if(old) old.remove();
  if(fams.length){
    var l=document.createElement("link");
    l.id="de-fonts"; l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?"+fams.join("&")+"&display=swap";
    document.head.appendChild(l);
  }
  var fav=safeUrl(setting("favicon_url",""));
  if(fav&&!document.getElementById("de-fav")){
    var f=document.createElement("link");f.id="de-fav";f.rel="icon";f.href=fav;
    document.head.appendChild(f);
  }
  var rail=$("#rail"), ser=sortBy(rows("Series"),"sort_order");
  rail.innerHTML=ser.map(function(s){
    return '<span style="background:'+esc(s.accent_color||"var(--primary)")+'"></span>'}).join("");
}

/* Images get a src only when they come near the viewport. The first hero
   image is the exception: it is the LCP element and is fetched immediately. */
function media(p,accent,opt){
  opt=opt||{};
  var url=safeUrl(p.main_image_url);
  if(!url) return packshot(p,accent);
  var alt=esc(L(p,"image_alt")||L(p,"product_name"));
  var eager=!!opt.eager;
  return (opt.skeleton!==false?'<span class="imgskel" aria-hidden="true"></span>':"")+
    '<img '+(eager?'src="'+esc(url)+'" fetchpriority="high" loading="eager"'
                 :'data-src="'+esc(url)+'" loading="lazy"')+
    ' alt="'+alt+'" decoding="async" width="600" height="750"'+
    ' data-pid="'+esc(p.product_id)+'"'+(eager?' class="ready"':"")+'>';
}
var imgIO=null;
function watchImages(root){
  var list=$$('img[data-src]',root||document);
  if(!list.length) return;
  function show(img){
    img.src=img.getAttribute("data-src");
    img.removeAttribute("data-src");
    img.addEventListener("load",function(){
      img.classList.add("ready");
      var sk=img.parentNode&&img.parentNode.querySelector(".imgskel");
      if(sk) sk.remove();
    },{once:true});
    img.addEventListener("error",function(){
      var p=byId("Products","product_id",img.getAttribute("data-pid"));
      var host=img.parentNode; if(!host) return;
      var sk=host.querySelector(".imgskel"); if(sk) sk.remove();
      if(p){var d=document.createElement("div");d.innerHTML=packshot(p,accentOf(p));
        if(d.firstChild) host.replaceChild(d.firstChild,img); else img.remove();}
      else img.remove();
    },{once:true});
  }
  if(!("IntersectionObserver" in window)){list.forEach(show);return}
  if(!imgIO) imgIO=new IntersectionObserver(function(en){
    en.forEach(function(e){if(e.isIntersecting){show(e.target);imgIO.unobserve(e.target)}});
  },{rootMargin:"300px 0px"});
  list.forEach(function(i){imgIO.observe(i)});
}
/* eager images still need their skeleton cleared */
function primeEager(root){
  $$('img.ready',root||document).forEach(function(img){
    function done(){var sk=img.parentNode&&img.parentNode.querySelector(".imgskel");if(sk) sk.remove()}
    if(img.complete) done(); else img.addEventListener("load",done,{once:true});
    img.addEventListener("error",function(){
      var p=byId("Products","product_id",img.getAttribute("data-pid"));
      var host=img.parentNode; if(!host) return;
      var sk=host.querySelector(".imgskel"); if(sk) sk.remove();
      if(p){var d=document.createElement("div");d.innerHTML=packshot(p,accentOf(p));
        if(d.firstChild) host.replaceChild(d.firstChild,img)}
    },{once:true});
  });
}

function navUsable(n){
  if(n.link_type==="category") return !!byId("Categories","category_id",n.link_value);
  if(n.link_type==="series") return !!byId("Series","series_id",n.link_value);
  if(n.link_type==="page"){
    if(n.link_value==="home"||n.link_value==="products") return true;
    return !!byId("Pages","slug",n.link_value);
  }
  if(n.link_type==="url") return !!safeUrl(n.link_value);
  return true;
}
function navHref(n){
  if(n.link_type==="category"){var c=byId("Categories","category_id",n.link_value);
    return c?"#/category/"+encodeURIComponent(c.category_slug):"#/products"}
  if(n.link_type==="series"){var s=byId("Series","series_id",n.link_value);
    return s?"#/series/"+encodeURIComponent(s.slug):"#/products"}
  if(n.link_type==="url") return safeUrl(n.link_value)||"#/";
  if(n.link_type==="anchor") return safeUrl(n.link_value)||"#/";
  if(n.link_value==="home") return "#/";
  if(n.link_value==="products") return "#/products";
  return "#/page/"+encodeURIComponent(n.link_value);
}

function initHero(){
  var host=$(".hero"); if(!host) return;
  var slides=$$(".slide",host), dots=$$(".dots button",host);
  S.heroIdx=0;
  if(slides.length<2) return;
  function go(n){
    slides[S.heroIdx].classList.remove("on");
    slides[S.heroIdx].setAttribute("aria-hidden","true");
    dots[S.heroIdx].setAttribute("aria-current","false");
    S.heroIdx=(n+slides.length)%slides.length;
    slides[S.heroIdx].classList.add("on");
    slides[S.heroIdx].removeAttribute("aria-hidden");
    dots[S.heroIdx].setAttribute("aria-current","true");
    watchImages(slides[S.heroIdx]);
  }
  dots.forEach(function(d){d.addEventListener("click",function(){
    go(+d.getAttribute("data-go"));stop()})});
  function stop(){clearInterval(S.heroTimer);S.heroTimer=null}
  function start(){
    if(!flag("enable_animations",true)) return;
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    stop(); S.heroTimer=setInterval(function(){go(S.heroIdx+1)},8000);
  }
  host.addEventListener("mouseenter",stop);
  host.addEventListener("focusin",stop);
  host.addEventListener("mouseleave",start);
  start();
}

    if(f.skin.length&&!f.skin.some(function(v){return ids(p.skin_type_ids).indexOf(v)>-1})) return false;
    if(f.concern.length&&!f.concern.some(function(v){return ids(p.concern_ids).indexOf(v)>-1})) return false;
    if(q){
      var hay=[L(p,"product_name"),p.product_name_ar,p.product_name_en,L(p,"short_description"),
        L(p,"main_ingredients"),p.sku,L(p,"product_type")].join(" ").toLowerCase();
      var ing=keyActives(p).map(function(i){
        return [i.ingredient_name_ar,i.ingredient_name_en,i.inci_name].join(" ")}).join(" ").toLowerCase();
      if(hay.indexOf(q)===-1&&ing.indexOf(q)===-1) return false;
    }
    return true;
  });
}

/* --------------------------------------------------------------------- SEO */
function setMeta(title,desc,image){
  var row=(S.data.SEO_Global||[]).filter(function(r){return r.seo_key==="site_title_template"})[0];
  var tmpl=row?(row["value_"+S.lang]||row.value_ar):"{{page}}";
  document.title=String(tmpl).replace("{{page}}",title||"");
  function m(sel,v){var e=document.querySelector(sel);if(e&&v!==undefined&&v!==null) e.setAttribute("content",v)}
  m('meta[name=description]',desc||"");
  m('meta[property="og:title"]',document.title);
  m('meta[property="og:description"]',desc||"");
  var og=(S.data.SEO_Global||[]).filter(function(r){return r.seo_key==="og_image_url"})[0];
  m('meta[property="og:image"]',image||(og?safeUrl(og.value_ar):"")||"");
  var can=document.querySelector("link[rel=canonical]"); if(can) can.href=location.href;
  document.documentElement.lang=S.lang;
}
function jsonLd(o){

/* ------------------------------------------------------------------ router */
function route(){
  if(!S.data) return;
  var parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(function(x){
    try{return decodeURIComponent(x)}catch(e){return x}});
  var kind=parts[0]||"", key=parts[1]||"";
  if(kind!=="product") closeDetail();
  renderNav();

  if(!kind){renderHome();window.scrollTo(0,0);return}
  if(kind==="products"){
    var pg=byId("Pages","page_type","products");
    renderList(rows("Products"),pg?L(pg,"title"):t("products"),pg?L(pg,"subtitle"):"");
    window.scrollTo(0,0);return;
  }
  if(kind==="category"){
    var c=byId("Categories","category_slug",key); if(!c) return notFound();
    S.filters={cat:[c.category_id],skin:[],concern:[],series:[]};
    renderList(rows("Products"),L(c,"category_name"),
      L(c,"full_description")||L(c,"short_description"));
    window.scrollTo(0,0);return;
  }
  if(kind==="series"){
    var s=byId("Series","slug",key); if(!s) return notFound();
    S.filters={cat:[],skin:[],concern:[],series:[s.series_id]};
    renderList(rows("Products"),L(s,"series_name"),L(s,"description"));
    window.scrollTo(0,0);return;
  }
  if(kind==="concern"){
    var cn=byId("Concerns","slug",key); if(!cn) return notFound();
    S.filters={cat:[],skin:[],concern:[cn.concern_id],series:[]};
    renderList(rows("Products"),L(cn,"concern_name"),"");
    window.scrollTo(0,0);return;
  }
  if(kind==="page"){
    var p2=byId("Pages","slug",key); if(!p2) return notFound();
    renderPage(p2);window.scrollTo(0,0);return;
  }
  if(kind==="product"){
    var p=rows("Products").filter(function(x){
      return x.slug_ar===key||x.slug_en===key||x.product_id===key})[0];
    if(!p) return notFound();
    if(!$("#main").innerHTML) renderHome();
    renderDetail(p);return;
  }
  notFound();
}

function toast(m){
  var e=$("#toast"); e.textContent=m; e.classList.add("on");
  clearTimeout(e.__t); e.__t=setTimeout(function(){e.classList.remove("on")},2600);

function reveal(){
  var rm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var on=flag("enable_animations",true)&&!rm;
  var list=$$(".rv");
  if(!on||!("IntersectionObserver" in window)){list.forEach(function(e){e.classList.add("in")});return}
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}});
  },{rootMargin:"0px 0px -6% 0px"});
  list.forEach(function(e,i){e.style.transitionDelay=Math.min((i%3)*60,150)+"ms";io.observe(e)});
}

}

function embedded(){

}
function fetchAPI(){
  return new Promise(function(res,rej){
    if(!CONFIG.API_URL) return rej(new Error("no-api"));
    var url=CONFIG.API_URL+(CONFIG.API_URL.indexOf("?")>-1?"&":"?")+"bundle=site";
    var ctrl=("AbortController" in window)?new AbortController():null;
    var timer=setTimeout(function(){if(ctrl) ctrl.abort();rej(new Error("timeout"))},
      CONFIG.FETCH_TIMEOUT);
    fetch(url,ctrl?{signal:ctrl.signal}:{})
      .then(function(r){if(!r.ok) throw new Error("HTTP "+r.status);return r.json()})
      .then(function(j){
        clearTimeout(timer);
        if(!j||!j.success||!j.data) throw new Error(j&&j.error?j.error:"bad payload");
        res(j.data);
      })
      .catch(function(e){clearTimeout(timer);rej(e)});
  });
}
function adopt(d,stale){
  var sig=JSON.stringify(d);
  if(sig===S.sig&&S.data){                       /* nothing changed: no repaint */
    S.stale=stale; showNotice(); return false;
  }
  S.sig=sig; S.data=d; S.stale=stale; return true;
}
function showNotice(){
  var n=$("#notice");
  if(S.stale){n.hidden=false;n.innerHTML='<div class="notice">'+esc(t("stale"))+'</div>'}
  else{n.hidden=true;n.innerHTML=""}
}
function load(){
  var snap=embedded();
  var cached=cacheRead();
  var fresh=cached&&(Date.now()-cached.at)<CONFIG.CACHE_MINUTES*60000;

  /* paint something immediately: cache if fresh, else the embedded snapshot */
  var seed=fresh?cached.data:(cached?cached.data:snap);
  if(seed){adopt(seed,!!CONFIG.API_URL);boot();}
  else if(CONFIG.API_URL){skeleton();}
  else{errorState();return;}

  if(!CONFIG.API_URL){S.stale=false;showNotice();return}
  if(fresh&&seed){S.stale=false;showNotice();return}   /* cache still valid */

  fetchAPI().then(function(d){
    cacheWrite(d);
    var y=window.scrollY, open=$("#pd").classList.contains("on");
    if(adopt(d,false)){boot(); if(!open) window.scrollTo(0,y);}
    else showNotice();
  }).catch(function(){
    if(S.data){S.stale=true;showNotice();return}
    if(snap){adopt(snap,true);boot();return}
    errorState();
  });
}

/* ------------------------------------------------------------------- search */
var sIdx=-1;
function searchOpen(){
  var w=$("#sw");
  S.lastFocus=document.activeElement;
  w.classList.add("on"); w.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  $("#sIn").value=""; $("#sIn").setAttribute("aria-expanded","false");
  $("#sRes").innerHTML='<p class="shint">'+esc(t("searchHint"))+'</p>';
  $("#sKbd").textContent=t("kbd");
  sIdx=-1; $("#sIn").focus();
}
function searchClose(){
  var w=$("#sw");
  if(!w.classList.contains("on")) return;
  w.classList.remove("on"); w.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  if(S.lastFocus&&S.lastFocus.focus) try{S.lastFocus.focus()}catch(e){}
}
function searchRun(q){
  var box=$("#sRes"), inp=$("#sIn");
  if(q.length<2){box.innerHTML='<p class="shint">'+esc(t("searchHint"))+'</p>';
    inp.setAttribute("aria-expanded","false");sIdx=-1;return}
  var prev=S.query; S.query=q;
  var hits=applyFilters(rows("Products")).slice(0,8);
  S.query=prev;
  if(!hits.length){box.innerHTML='<p class="shint">'+esc(t("noneT"))+'</p>';
    inp.setAttribute("aria-expanded","false");sIdx=-1;return}
  box.innerHTML=hits.map(function(p,i){
    var act=keyActives(p)[0];
    var sub=[L(p,"product_type"),act?L(act,"ingredient_name"):skinNames(p)[0]||""]
      .filter(Boolean).join(" · ");
    return '<a role="option" id="so'+i+'" aria-selected="false" href="#/product/'+
      esc(slugOf(p))+'"><span class="th">'+media(p,accentOf(p),{skeleton:false})+'</span>'+
      '<span><strong>'+esc(L(p,"product_name"))+'</strong><small>'+esc(sub)+'</small></span></a>';
  }).join("");
  inp.setAttribute("aria-expanded","true");
  sIdx=-1; watchImages(box);
}
function searchMove(d){
  var opts=$$("#sRes a"); if(!opts.length) return;
  if(sIdx>-1&&opts[sIdx]){opts[sIdx].classList.remove("sel");opts[sIdx].setAttribute("aria-selected","false")}
  sIdx=(sIdx+d+opts.length)%opts.length;
  opts[sIdx].classList.add("sel"); opts[sIdx].setAttribute("aria-selected","true");
  $("#sIn").setAttribute("aria-activedescendant",opts[sIdx].id);
  if(opts[sIdx].scrollIntoView) opts[sIdx].scrollIntoView({block:"nearest"});
}
function trapFocus(e,host){
  if(e.key!=="Tab") return;
  var f=$$('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])',host)
    .filter(function(x){return x.offsetParent!==null||x===document.activeElement});
  if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}

/* -------------------------------------------------------------------- boot */
function setLang(l){
  S.lang=l;
  try{localStorage.setItem("de_lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.documentElement.dir=(l==="ar")?"rtl":"ltr";
  $("#lBtn").textContent=(l==="ar")?"EN":"عربي";
  $(".skip").textContent=t("skip");
  $("#sIn").placeholder=t("search");
  $("#sBtn").setAttribute("aria-label",t("search"));
  $("#bBtn").setAttribute("aria-label",t("menu"));
  $("#dwX").setAttribute("aria-label",t("close"));
  $("#sX").setAttribute("aria-label",t("close"));
  applyTheme(); renderAnn(); renderBrand($("#brand")); renderNav(); renderFooter(); route();
}
function boot(){
  var saved=null; try{saved=localStorage.getItem("de_lang")}catch(e){}
  var avail=String(setting("available_languages","ar,en")).split(",").map(function(x){return x.trim()});
  var def=setting("default_language","ar");
  S.lang=(saved&&avail.indexOf(saved)>-1)?saved:(avail.indexOf(def)>-1?def:(avail[0]||"ar"));
  S.perPage=parseInt(setting("products_per_page","9"),10)||9;
  CONFIG.CACHE_MINUTES=parseInt(setting("api_cache_minutes","10"),10)||10;
  $("#lBtn").hidden=!flag("enable_language_switcher",true)||avail.length<2;
  $("#sBtn").hidden=!flag("enable_search",true);
  showNotice();
  setLang(S.lang);
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click",function(e){
  var chip=e.target.closest(".chip[data-f]");
  if(chip){
    var k=chip.getAttribute("data-f"), v=chip.getAttribute("data-v");
    var a=S.filters[k], at=a.indexOf(v);
    if(at>-1) a.splice(at,1); else a.push(v);
    S.page=1; syncChips(); paint(window.__base||rows("Products"));
    return;
  }
  var rm=e.target.closest("[data-rm]");
  if(rm){
    var kk=rm.getAttribute("data-rm");
    if(kk==="q"){S.query="";var q=$("#lq");if(q) q.value=""}
    else{var vv=rm.getAttribute("data-v");var arr=S.filters[kk];
      var ix=arr.indexOf(vv); if(ix>-1) arr.splice(ix,1)}
    S.page=1; syncChips(); paint(window.__base||rows("Products"));
    return;
  }
  if(e.target.closest("[data-close]")){history.back();return}
  if(e.target.closest("[data-dw]")) closeDrawer();
});
function closeDrawer(){
  var d=$("#dw");
  if(!d.classList.contains("on")) return;
  d.classList.remove("on"); d.setAttribute("aria-hidden","true");
  $("#bBtn").setAttribute("aria-expanded","false");
  document.body.style.overflow="";
  $("#bBtn").focus();
}
document.addEventListener("DOMContentLoaded",function(){
  $("#bBtn").addEventListener("click",function(){
    var d=$("#dw"), on=!d.classList.contains("on");
    d.classList.toggle("on",on);
    d.setAttribute("aria-hidden",String(!on));
    this.setAttribute("aria-expanded",String(on));
    document.body.style.overflow=on?"hidden":"";
    if(on){var f=d.querySelector("a,button"); if(f) f.focus()}
  });
  $("#dwX").addEventListener("click",closeDrawer);
  $("#sBtn").addEventListener("click",searchOpen);
  $("#sX").addEventListener("click",searchClose);
  $("#sw").addEventListener("click",function(e){if(e.target===this) searchClose()});
  $("#sRes").addEventListener("click",function(e){if(e.target.closest("a")) searchClose()});

  var sd;
  $("#sIn").addEventListener("input",function(e){
    clearTimeout(sd); var v=e.target.value.trim().toLowerCase();
    sd=setTimeout(function(){searchRun(v)},200);
  });
  $("#sIn").addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){e.preventDefault();searchMove(1)}
    else if(e.key==="ArrowUp"){e.preventDefault();searchMove(-1)}
    else if(e.key==="Enter"){
      var o=$$("#sRes a")[sIdx]; if(o){e.preventDefault();location.hash=o.getAttribute("href");
        searchClose()}
    }
  });
  $("#lBtn").addEventListener("click",function(){setLang(S.lang==="ar"?"en":"ar")});

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
      if($("#sw").classList.contains("on")) return searchClose();
      if($("#pd").classList.contains("on")) return history.back();
      if($("#dw").classList.contains("on")) return closeDrawer();
      var sd2=$("#side"); if(sd2&&sd2.classList.contains("on")&&window.__closeSide) window.__closeSide();
      return;
    }
    if($("#sw").classList.contains("on")) trapFocus(e,$(".sbx"));
    else if($("#pd").classList.contains("on")) trapFocus(e,$("#panel"));
    else if($("#dw").classList.contains("on")) trapFocus(e,$("#dw"));
  });

  var last=0;
  window.addEventListener("scroll",function(){
    var y=window.pageYOffset||document.documentElement.scrollTop;
    if((y>10)!==(last>10)) $("#hd").classList.toggle("on",y>10);
    last=y;
  },{passive:true});

  window.addEventListener("hashchange",route);
  window.addEventListener("online",function(){if(S.stale) load()});
  load();
});
</script>
</body>
